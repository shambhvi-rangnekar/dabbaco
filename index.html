function normRecipe(o,q,g,p){if(!o||typeof o!=="object"||o.error)throw{code:"bad"};const num=x=>Math.max(0,Math.round((+x||0)*10)/10);
  const nb=x=>{x=x||{};return{kcal:Math.round(+x.kcal||0),p:num(x.p),c:num(x.c),f:num(x.f),fib:num(x.fib)}};
  const ing=(Array.isArray(o.ing)?o.ing:[]).filter(i=>Array.isArray(i)&&i[0]).slice(0,30).map(i=>[String(i[0]).toLowerCase().slice(0,50),num(i[1]),["g","ml","pc","tsp","tbsp"].includes(i[2])?i[2]:"g",i[3]?String(i[3]).slice(0,80):""]);
  const steps=(Array.isArray(o.steps)?o.steps:[]).filter(s=>Array.isArray(s)&&s[1]).slice(0,14).map(s=>[String(s[0]||"Step").slice(0,60),String(s[1]).slice(0,800),Math.min(600,Math.max(0,Math.round(+s[2]||0)))]);
  if(!ing.length||!steps.length)throw{code:"bad"};
  const tags=(Array.isArray(o.tags)?o.tags:[]).filter(t=>HPREFIX[t]).slice(0,3);
  return{id:"a"+Date.now().toString(36),ai:true,name:String(o.name||("Healthier "+q)).slice(0,60),was:String(o.was||q).slice(0,40),
    diet:p.diet==="vegan"?"vg":p.diet==="nonveg"?"n":p.diet==="egg"?"e":"v",serves:clamp(Math.round(+o.serves||4),1,12),serv:String(o.serv||"1 serving").slice(0,30),
    roles:/^[BOMK]$/.test(o.roles)?o.roles:"O",prep:Math.max(0,Math.round(+o.prep||0)),cook:Math.max(0,Math.round(+o.cook||0)),tags:tags.length?tags:[g],
    swaps:(Array.isArray(o.swaps)?o.swaps:[]).map(s=>String(s).slice(0,200)).slice(0,8),before:nb(o.before),after:nb(o.after),fe:0,ca:0,ing,steps,
    ahead:o.ahead?String(o.ahead).slice(0,300):"",store:o.store?String(o.store).slice(0,300):"",fr:2,frz:0}}
async function aiRecipe(q){q=String(q||"").trim();if(!AI||!q)return;const setS=m=>{const s=document.getElementById("ai-status");if(s)s.textContent=m};const btn=document.querySelector('[data-act="ai-recipe"]');if(btn)btn.disabled=true;
  setS("Writing your recipe. This usually takes under a minute.");const p=state.profile,T=targets(p),g=view.hgoal||defaultHGoal(p);
  const prompt=`Create a healthier home-cooked version of "${q}" for an Indian home cook.
Goal for this version: ${GOALTXT[g]}.
Diet: ${DIET_LABEL[p.diet]}${p.diet==="jain"?" (no onion, garlic, potato or other root vegetables)":""}. Foods to avoid: ${p.dis||"none"}.
Their daily targets: ${T.kcal} kcal, ${T.protein} g protein, ${T.carbs} g carbs, ${T.fat} g fat, ${T.fib} g fibre.
Rules:
- Keep it recognisable and tasty. Use ingredients that are easy to find in India or in Indian stores abroad.
- Main ingredients in g, ml or pc (pieces). Spices and small amounts in tsp or tbsp.
- Write 6 to 10 steps a beginner can follow without guessing: heat level, what pan to use, what it should look, smell or feel like when it's ready, and the minutes for each step (0 if there is no wait). Include soaking, marinating or chilling steps when needed.
- Give per-serving nutrition estimates for the usual version ("before") and your version ("after").
- No supplements, protein powders or medical claims.
If "${q}" is not a food or drink, return {"error":"not a dish"}.
Return only JSON in this shape:
{"name":"short name for your version","was":"usual dish name","serves":4,"serv":"what one serving is, like 1 slice or 1 katori","roles":"B for breakfast, O for a full meal, M for a main eaten with roti or rice, K for a snack or dessert","prep":15,"cook":30,"tags":["light, protein, lowcarb, fibre or gain"],"swaps":["what you changed and why"],"before":{"kcal":0,"p":0,"c":0,"f":0,"fib":0},"after":{"kcal":0,"p":0,"c":0,"f":0,"fib":0},"ing":[["ingredient",100,"g","prep note"]],"steps":[["Short title","Detailed instruction",5]],"ahead":"what can be prepped ahead","store":"how to store it and for how long"}`;
  try{const o=await AI.json(prompt,{modelTier:"default"});const r=normRecipe(o,q,g,p);state.ai=state.ai||[];state.ai.unshift(r);state.ai=state.ai.slice(0,30);save();view.tab="recipes";view.recipe=r.id;view.rserves=null;render();window.scrollTo(0,0);toastMsg("Recipe saved to your recipes.")}
  catch(e){const c=e&&e.code;setS(c==="not_granted"?"Claude isn't allowed on this page. You can allow it from the page's permissions.":c==="rate_limited"?"Too many requests right now. Try again in a minute.":"Couldn't write that recipe. Check the dish name and try again.");const b=document.querySelector('[data-act="ai-recipe"]');if(b)b.disabled=false}}

function handleNew(a,el,p){

    case "save-track":{p.track=TRACKABLE.filter(k=>{const c=document.getElementById("tr-"+k);return c&&c.checked&&!(p.focus||[]).includes(k)});closeSheet();save();render();return true}

      const T0=targets(Object.assign({},p,{goal:d.goal,pace:d.pace,ovK:null}));const minK=manualMin(T0);let ovK=null;

      Object.assign(p,{goal:d.goal,pace:d.pace,macro:d.macro,ovK,ovP:null,mP:g(d.mP),mC:g(d.mC),mF:g(d.mF),mFib:g(d.mFib)});closeSheet();save();render();

    case "healthier-meal":mealHealthSheet(el.dataset.date,el.dataset.slot);return true;

      if(s.ctx){const m=state.days[s.ctx.date]&&state.days[s.ctx.date].meals[s.ctx.slot];if(m)m.items.forEach(it=>{if(it.id===s.id)it.id=v.id});closeSheet();save();render();toastMsg(v.name+" is in your plan.")}

    case "hs-ai":{const d=dish(view.sheet.id),g=view.sheet.g;closeSheet();view.tab="recipes";view.recipe=null;view.rq=d.name;view.hgoal=g;render();window.scrollTo(0,0);aiRecipe(d.name);return true}
    case "hgoal":view.hgoal=el.dataset.v;render();return true;

    case "back-recipes":view.recipe=null;render();return true;
    case "rserves":{const r=findRecipe(view.recipe);view.rserves=clamp((view.rserves||r.serves)+(+el.dataset.v),1,24);render();return true}

    case "recipe-plan":{const r=findRecipe(view.recipe);const id="r_"+r.id;if(!dish(id))state.custom.push(recipeDish(r));planPickSheet(id,r.name,slotForRole(r.roles));return true}
    case "pick-replace":case "pick-add":{const k=document.getElementById("pk-day").value,sl=document.getElementById("pk-slot").value,id=view.sheet.dishId;const day=state.days[k]||(state.days[k]={meals:{},extra:[]});day.meals=day.meals||{};
      if(a==="pick-replace"||!day.meals[sl])day.meals[sl]={items:[{id,q:1}],eaten:false,locked:true};else day.meals[sl].items.push({id,q:1});closeSheet();save();render();toastMsg("Added to "+dShort(k)+".");return true}
    case "cook-start":openCook();return true;

    case "cook-next":stopTimer();if(cook.i>=cook.r.steps.length-1){closeCook();toastMsg("Done. Enjoy your meal.")}else{cook.i++;cook.left=null;renderCook()}return true;
    case "cook-prev":stopTimer();if(cook.i>0){cook.i--;cook.left=null}renderCook();return true;
    case "gen-tomorrow":state.days[addDays(today(),1)]=genDay(p);save();render();return true;
    case "share-day":textSheet("Share my day",dayText(today()));return true;
    case "copy-text":{const t=view.sheet.text;const ta=document.getElementById("copy-ta");try{navigator.clipboard.writeText(t).then(()=>toastMsg("Copied."),()=>{ta.focus();ta.select()})}catch(e){ta.focus();ta.select()}return true}
  }
  return false}

function settingsSheet(){const p=state.profile;view.sheet={type:"settings",confirm:false};
  openSheet(`<h2>Settings</h2>
  <div class="card stack"><div class="row between"><div><b>${esc(p.name)}</b><div class="small muted">${p.age} · ${DIET_LABEL[p.diet]} · ${p.sess===2?"prep twice a week":"prep once a week"} · ${p.ppl} ${p.ppl>1?"people":"person"} · ${MACRO_LABEL[p.macro||"balanced"]}</div></div><button class="btn sm" data-act="edit-profile">Edit</button></div>
  <div class="small muted">Focus: ${focusList(p).map(k=>LABEL[k]).join(", ")||"none"}</div></div>
  <div class="row between"><b>Weight unit</b>${setSeg("wu",[["kg","kg"],["lb","lb"]],p.wu)}</div>
  <div class="row between"><b>Height unit</b>${setSeg("hu",[["cm","cm"],["ft","ft / in"]],p.hu)}</div>
  <div class="row between wrapflex"><div><b>Daily values</b><div class="small muted">Reference for nutrient targets</div></div>${setSeg("std",[["IN","India (ICMR)"],["US","US (NIH)"]],p.std||"IN")}</div>
  <p class="small muted">${cloud.ref?"Your plan is saved to your Claude account and on this device.":"Your plan is saved only on this device and browser. Clearing browser data erases it."}</p>
  <label class="toggle"><span><b>Share anonymous usage stats</b><br><span class="small muted">Counts like "a week was planned" help improve DabbaCo. Never your name, weight or health details.</span></span><input type="checkbox" data-act="stats" ${statsOn()?"checked":""}></label>
  <button class="btn danger" data-act="reset" id="reset-btn">Start over</button><button class="btn ghost" data-act="close">Close</button>`)}
function setSeg(f,opts,cur){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button data-act="set-pref" data-f="${f}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join("")}</div>`}

/* ---------- Demo ---------- */
function loadDemo(){state=blank();state.demo=true;
  state.profile={name:"Ananya",age:27,sex:"f",hcm:160,kg:62,act:1,goal:"lose",pace:"gentle",tkg:57,diet:"veg",cu:["M","N","S"],dis:"karela",focus:["fe","b12","d"],sess:2,ppl:1,wu:"kg",hu:"cm",std:"IN",ovK:null,ovP:null};
  const t=today();state.weights=[{d:addDays(t,-21),kg:63.4},{d:addDays(t,-14),kg:63},{d:addDays(t,-10),kg:62.8},{d:addDays(t,-6),kg:62.5},{d:addDays(t,-2),kg:62.2},{d:t,kg:62}];state.profile.kg=62;
  DEFAULT_PANTRY.forEach(n=>state.pantry[n]=true);genWeek();const d=state.days[t];if(d){d.meals.B.eaten=true}
  view.tab="today";save();render();toastMsg("This is an example. Nothing here is your data.")}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  if(e.target===$sheet){closeSheet();return}
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(el.type==="checkbox")return; // handled on change
  trackAct(a,el);
  const p=state.profile;
  if(handleNew(a,el,p))return;
  switch(a){
    case "tab":view.tab=el.dataset.v;if(view.tab==="recipes")view.recipe=null;render();window.scrollTo(0,0);break;
    case "ob-start":startOb(false);break;
    case "start-own":state=blank();save();startOb(false);break;
    case "demo":loadDemo();break;
    case "ob-set":{const f=el.dataset.f;let v=el.dataset.v;if(["act","sess"].includes(f))v=+v;readObInputs();const od=view.ob.d;
      if(f==="wu"&&od.wu!==v){const c=v==="lb"?2.20462:1/2.20462;["wIn","tIn"].forEach(x=>{if(+od[x])od[x]=Math.round(od[x]*c*10)/10})}
      if(f==="hu"&&od.hu!==v){if(v==="ft"&&+od.hcm){const t=od.hcm/2.54;od.hft=Math.floor(t/12);od.hin=Math.round(t%12)}if(v==="cm"&&(+od.hft||+od.hin))od.hcm=Math.round(((+od.hft||0)*12+(+od.hin||0))*2.54)}
      view.ob.d[f]=v;view.ob.err="";render();break}
    case "ob-toggle":{readObInputs();const arr=view.ob.d[el.dataset.f];const v=el.dataset.v;const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);render();break}
    case "ob-next":{readObInputs();const err=obValidate();view.ob.err=err;if(err){render();return}if(OB_STEPS[view.ob.step]==="done"){finishOb();return}view.ob.step++;render();window.scrollTo(0,0);break}
    case "ob-back":readObInputs();view.ob.err="";view.ob.step--;render();break;
    case "ob-cancel":view.ob=null;render();break;
    case "settings":settingsSheet();break;
    case "close":closeSheet();break;
    case "gen-day":state.days[today()]=genDay(p);save();render();break;
    case "gen-week":genWeek();view.flash=null;save();render();toastMsg("New week planned. Groceries and prep updated.");break;
    case "dismiss-flash":view.flash=null;render();break;
    case "portion":{const m=state.days[el.dataset.date].meals[el.dataset.slot];const f=+el.dataset.v;m.items.forEach(it=>{const d=dish(it.id);const step=d&&isBread(d)?1:.25;let q=roundTo(it.q*f,step);if(q===it.q)q=it.q+(f>1?step:-step);it.q=Math.max(step,Math.min(8,q))});save();render();break}
    case "swap":swapSheet(el.dataset.date,el.dataset.slot);break;
    case "reswap":swapSheet(view.sheet.date,view.sheet.slot);break;
    case "pick-swap":{const s=view.sheet;const m=s.cands[+el.dataset.i];const old=state.days[s.date].meals[s.slot];m.locked=old.locked;state.days[s.date].meals[s.slot]=m;closeSheet();save();render();toastMsg("Meal swapped.");break}
    case "lock":{const m=state.days[el.dataset.date].meals[el.dataset.slot];m.locked=!m.locked;save();render();break}
    case "add-food":foodSheet();break;
    case "add-extra":{const day=state.days[today()]||(state.days[today()]={meals:{},extra:[]});day.extra=day.extra||[];day.extra.push({id:el.dataset.id,q:+el.dataset.q});save();render();toastMsg("Added "+dish(el.dataset.id).name+".");break}
    case "rm-extra":{state.days[today()].extra.splice(+el.dataset.i,1);save();render();break}
    case "custom-form":customForm();break;
    case "save-custom":{const g=id=>document.getElementById(id).value;const name=g("c-name").trim(),kc=+g("c-kcal");const er=document.getElementById("c-err");
      if(!name||!(kc>0)){er.textContent="Add a name and calories to save.";er.hidden=false;return}
      const n=k=>Math.max(0,+g("c-"+k)||0);const d={id:"c"+Date.now(),name,roles:g("c-role"),diet:g("c-diet"),j:false,cu:"X",serv:g("c-serv").trim()||"1 serving",kcal:kc,p:n("p"),c:n("c"),f:n("f"),fib:n("fib"),fe:n("fe"),b12:n("b12"),d:0,ca:n("ca"),fol:0,zn:0,fr:2,frz:false,soak:false,ing:[],custom:true};
      state.custom.push(d);const day=state.days[today()]||(state.days[today()]={meals:{},extra:[]});day.extra=day.extra||[];day.extra.push({id:d.id,q:1});closeSheet();save();render();toastMsg("Saved "+name+" and added it to today.");break}
    case "edit-targets":view.sheet=null;targetsSheet();break;
    case "save-targets":{const k=+document.getElementById("t-k").value,pr=+document.getElementById("t-p").value;const T=targets(Object.assign({},p,{ovK:null}));const er=document.getElementById("t-err");
      if(k&&k<T.floor){er.textContent="We don't plan below "+T.floor.toLocaleString()+" kcal a day. Enter "+T.floor.toLocaleString()+" or more, or leave it empty.";er.hidden=false;return}
      if(pr&&(pr<20||pr>300)){er.textContent="Enter protein between 20 and 300 g, or leave it empty.";er.hidden=false;return}
      p.ovK=k||null;p.ovP=pr||null;closeSheet();save();render();toastMsg("Targets saved. Regenerate your week to use them.");break}
    case "edit-profile":closeSheet();startOb(true);break;
    case "set-pref":{p[el.dataset.f]=el.dataset.v;save();settingsSheet();render();break}
    case "reset":{if(!view.sheet.confirm){view.sheet.confirm=true;el.textContent="Tap again to erase everything";return}state=blank();save();closeSheet();view={tab:"today",ob:null};render();break}
    case "have":state.pantry[el.dataset.n]=true;save();render();break;
    case "unhave":delete state.pantry[el.dataset.n];save();render();break;
    case "mdel":state.manual.splice(+el.dataset.i,1);save();render();break;
    case "copy-list":{const t=groceryText();const done=()=>toastMsg("List copied.");
      try{navigator.clipboard.writeText(t).then(done,()=>showCopy(t))}catch(err){showCopy(t)}break}
    case "wdel":{state.weights=state.weights.filter(x=>x.d!==el.dataset.d);const last=state.weights[state.weights.length-1];if(last)p.kg=last.kg;save();render();break}
  }
});
function showCopy(t){openSheet(`<h2>Copy your list</h2><p class="small muted">Select the text and copy it.</p><textarea class="input" id="copy-ta" style="min-height:260px">${esc(t)}</textarea><button class="btn" data-act="close">Done</button>`);const ta=document.getElementById("copy-ta");ta.focus();ta.select()}
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset||!el.dataset.act)return;const a=el.dataset.act;
  if(a==="eaten"){const m=state.days[el.dataset.date].meals[el.dataset.slot];m.eaten=el.checked;if(el.checked)track("meal_eaten",{slot:el.dataset.slot});save();render();if(el.checked)toastMsg("Nice. Logged.")}
  if(a==="stats"){try{localStorage.setItem("dabbaco.noStats",el.checked?"0":"1")}catch(e){}if(el.checked)track("stats_turned_on");toastMsg(el.checked?"Thanks. Anonymous stats are on.":"Anonymous stats are off.")}
  if(a==="gcheck"){if(el.checked)state.checked[el.dataset.n]=true;else delete state.checked[el.dataset.n];save();render()}
  if(a==="hs-rule"){view.sheet.on[+el.dataset.i]=el.checked;healthifySheet(view.sheet.id)}
  if(a==="mcheck"){state.manual[+el.dataset.i].done=el.checked;save();render()}});
document.addEventListener("input",e=>{if(e.target.id==="food-q"){document.getElementById("food-res").innerHTML=foodResults(e.target.value)}if(e.target.id==="rec-q"){view.rq=e.target.value;document.getElementById("rec-res").innerHTML=recipeResults(view.rq)}});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  if(f.dataset.form==="manual"){const v=document.getElementById("manual-in").value.trim();if(v){state.manual.push({name:v,done:false});save();render()}}
  if(f.dataset.form==="weight"){const p=state.profile;let v=+document.getElementById("w-in").value;const d=document.getElementById("w-date").value||today();if(p.wu==="lb")v=v/2.20462;
    if(!(v>=30&&v<=250)){toastMsg("Enter a weight between "+(p.wu==="lb"?"66 and 550 lb":"30 and 250 kg")+".");return}
    track("weight_logged");const before=targets(p).kcal;upsertWeight(d,Math.round(v*10)/10);const after=targets(p).kcal;save();render();
    toastMsg(after!==before?"Logged. Your target is now "+after.toLocaleString()+" kcal a day.":"Weight logged.")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$sheet.hidden)closeSheet();if(e.key==="Enter"&&view.ob&&e.target.matches&&e.target.matches("input.input")){e.preventDefault();document.querySelector('[data-act="ob-next"]').click()}});
function readObInputs(){if(!view.ob)return;document.querySelectorAll("#app [data-f]").forEach(i=>{if(i.tagName==="INPUT"||i.tagName==="TEXTAREA")view.ob.d[i.dataset.f]=i.value})}

/* ---------- Boot ---------- */
if(state.profile&&!state.days[today()]&&state.week&&!state.week.dates.includes(today())){/* week ended: keep data, Today offers a fresh plan */}
render();
initCloud();
initAI();
track("$pageview");track("app_opened",{has_profile:!!state.profile,demo:!!state.demo});
</script>
</body>
