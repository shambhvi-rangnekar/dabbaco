<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="DabbaCo: free Indian meal prep with calorie and macro targets, healthier recipes, nutrient tracking and grocery lists.">
<title>DabbaCo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app shell. Sticky header, fixed bottom tab bar, cards only for meals, boxes and summaries. */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --surface-2:#E8EEE6; --ink:#15201A; --muted:#58675E; --line:#D5DED3;
  --leaf:#1D5A3F; --leaf-ink:#FFFFFF; --leaf-soft:#DAEADF; --haldi:#C98A0E; --haldi-soft:#FBEFD3;
  --good:#2D8456; --warn:#AF6708; --low:#BC4136; --shadow:0 1px 2px rgba(21,32,26,.06),0 4px 14px rgba(21,32,26,.05);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1310; --surface:#151D18; --surface-2:#1D2721; --ink:#E5EDE7; --muted:#96A59B; --line:#28342D;
  --leaf:#5CBA88; --leaf-ink:#0A1710; --leaf-soft:#1B3226; --haldi:#EBB23A; --haldi-soft:#3A2E13;
  --good:#5CBA88; --warn:#E39C3A; --low:#E7776C; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#151D18; --surface-2:#1D2721; --ink:#E5EDE7; --muted:#96A59B; --line:#28342D;
  --leaf:#5CBA88; --leaf-ink:#0A1710; --leaf-soft:#1B3226; --haldi:#EBB23A; --haldi-soft:#3A2E13;
  --good:#5CBA88; --warn:#E39C3A; --low:#E7776C; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--haldi);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.2rem}
.brand svg{width:26px;height:26px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

main{padding-block:16px 120px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--leaf)}
.tab[aria-current="page"] .pip{background:var(--leaf)}
.pip{width:18px;height:3px;border-radius:2px;background:transparent;margin-bottom:3px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.section{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.section:first-child{margin-top:0}
.note{font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;margin-top:22px}
.banner{background:var(--haldi-soft);border:1px solid color-mix(in srgb,var(--haldi) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--low);border-color:color-mix(in srgb,var(--low) 45%,transparent)}
.linkbtn{background:none;border:0;padding:0;color:var(--leaf);font-weight:600;font-size:.88rem}

/* chips & segmented */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.9rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.badge.warn{background:var(--haldi-soft);color:var(--warn)}
.badge.low{background:color-mix(in srgb,var(--low) 14%,transparent);color:var(--low)}

/* inputs */
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:1rem;min-width:0}
textarea.input{min-height:90px;resize:vertical}
.input:focus{border-color:var(--leaf);outline:none;box-shadow:0 0 0 3px var(--leaf-soft)}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.opt b{font-weight:600}
.opt span{font-size:.85rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf);background:var(--leaf-soft)}

/* onboarding */
.ob{padding-block:20px 40px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);border-radius:3px;transition:width .25s}
.ob h1{font-size:1.6rem}
.ob-actions{display:flex;gap:10px;margin-top:6px}
.ob-actions .btn{flex:1}
.err{color:var(--low);font-size:.86rem;font-weight:500}

/* welcome */
.hero{padding-block:28px 10px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:2.1rem}
.hero .tiffin{width:64px;height:64px}

/* today summary */
.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:112px;height:112px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lbl b{font-family:var(--display);font-size:1.45rem;line-height:1}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.kv b{font-variant-numeric:tabular-nums}

.bar{position:relative;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bar .plan{background:color-mix(in srgb,var(--leaf) 28%,transparent)}
.bar .eat{background:var(--leaf)}
.bar.focus .eat{background:var(--haldi)}
.bar.focus .plan{background:color-mix(in srgb,var(--haldi) 32%,transparent)}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.nrow .bar{grid-column:1 / -1}

/* meals */
.meal{display:flex;flex-direction:column;gap:10px}
.meal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.meal-head .slot{font-family:var(--display);font-weight:700;font-size:1.05rem}
.items{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:12px;font-size:.92rem}
.items li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.meal-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.check{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface)}
.check input{width:18px;height:18px;accent-color:var(--leaf);margin:0}
.meal.done{background:color-mix(in srgb,var(--leaf-soft) 55%,var(--surface))}
.stepper{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface);width:34px;height:34px;font-size:1.1rem;font-weight:600}
.stepper button+button{border-left:1px solid var(--line)}
.tips{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.tips li{display:flex;gap:10px;font-size:.9rem}
.tips li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--haldi);margin-top:.55em}

/* plan */
.day{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mrow .s{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mrow .d{font-size:.9rem;min-width:0}
.mrow .acts{display:flex;gap:4px}
.mini{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.mini svg{width:16px;height:16px}
.mini[aria-pressed="true"]{background:var(--haldi-soft);border-color:var(--haldi);color:var(--warn)}

/* prep boxes */
.boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.boxes{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.box .lid{background:var(--surface-2);padding:7px 12px;display:flex;justify-content:space-between;align-items:center;font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.box .lid .kc{letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.box .in{padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.box .store{font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);font-weight:700;font-size:.82rem;display:grid;place-items:center}
.steps b{display:block}

/* groceries */
.gcat{display:flex;flex-direction:column}
.gitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.gitem input{width:20px;height:20px;accent-color:var(--leaf);margin:0}
.gitem.got .nm{text-decoration:line-through;color:var(--muted)}
.gitem .q{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem;white-space:nowrap}
.gitem .have{font-size:.75rem;border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px}

/* progress chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.wlist{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.wlist li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,14,11,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.cand{text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:56px;height:56px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cmp{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{border-top:0;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.up{color:var(--good)} .dn{color:var(--low)} .wn{color:var(--warn)}
.big{font-family:var(--display);font-size:1.4rem;font-weight:700;line-height:1.2}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.rcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;width:100%;box-shadow:var(--shadow)}
.rcard b{font-family:var(--display);font-size:1.05rem;line-height:1.2}
.rcard .was{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--warn)}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing li{display:flex;gap:12px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--leaf);flex:none;margin:2px 0 0}
.bar.limit .eat{background:var(--low)}
.cook{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cook .wrapc{max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}
.cook .stepbody{font-size:1.2rem;line-height:1.6;overflow:auto;flex:1;min-height:0}
.timer{font-family:var(--display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="top" id="top" hidden><div class="wrap">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="4" width="18" height="4" rx="2" fill="var(--haldi)"/><rect x="6" y="9" width="20" height="6" rx="2" fill="var(--leaf)"/><rect x="6" y="16" width="20" height="6" rx="2" fill="var(--leaf)" opacity=".8"/><rect x="6" y="23" width="20" height="6" rx="2" fill="var(--leaf)" opacity=".6"/></svg><span>DabbaCo</span></div>

</div></div>
<main id="app" class="wrap"></main>

<script>
"use strict";
/* ---------- Dish library (per serving, values are estimates) ----------
 columns: id, name, roles, diet, jainOK, cuisines, serving,
 kcal, protein g, carbs g, fat g, fibre g, iron mg, B12 mcg, vit D mcg, calcium mg, folate mcg, zinc mg,
 fridge days, freezer ok, needs soaking, ingredients (grams per serving; "pc" = pieces)
 roles: B breakfast, M main, V veg side, R roti/rice, O one-pot meal, A add-on, K snack
 diet: vg vegan, v vegetarian, e egg, n non-veg. cuisines: N north, P punjabi, S south, M maharashtrian, G gujarati, B bengali, C indo-chinese, W continental, X everyday */
const RAW=[
["poha","Kanda poha","B","vg",0,"MX","1 plate",250,5,45,6,3,3.5,0,0,20,20,0.8,1,0,0,"poha:50|onion:30|peanuts:10|oil:7|lemon:5"],
["upma","Rava upma","B","vg",0,"SX","1 plate",280,7,42,9,3,1.5,0,0,30,25,0.8,1,0,0,"rava:50|onion:30|mixed veg:50|oil:8"],
["idli","Idli sambar","B","vg",0,"S","3 idli + sambar",330,12,60,4,7,3,0,0,60,80,1.5,3,1,1,"rice:60|urad dal:20|toor dal:20|mixed veg:60|tamarind:5|oil:3"],

 ["Add aromatics and capsicum","Add the ginger-garlic paste and stir for 1 minute, until the raw smell is gone. Add the capsicum and cook for 3 minutes until it softens.",4],
 ["Cook the tomatoes and masala","Add the tomatoes, pav bhaji masala, chilli powder and ¾ tsp salt. Cook, pressing the tomatoes with the back of your spoon, until they break down completely and oil shows at the edges, 8 to 10 minutes. Add a splash of the saved water if it starts to stick.",10],
 ["Bring it together","Add the mashed vegetables and ½ cup of the saved water. Mash everything together in the pan and simmer for 5 minutes, stirring so it doesn't catch. It should be thick but still spoonable.",5],

/* ---------- Utils ---------- */
function pad(n){return String(n).padStart(2,"0")}
function keyOf(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}

function parseKey(k){const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)}

function dLong(k){const d=parseKey(k);return WDL[d.getDay()]+", "+d.getDate()+" "+MO[d.getMonth()]}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function roundTo(x,s){return Math.round(x/s)*s}
function frac(x){let w=Math.floor(x+1e-9),r=Math.round((x-w)*4);if(r===4){w++;r=0}const f=["","¼","½","¾"][r];return w?(w+f):(f||"0")}
function fmtN(x,k){if(k==="kcal")return Math.round(x).toLocaleString("en-IN");if(x>=100)return String(Math.round(x));if(x>=10)return x.toFixed(0);return (Math.round(x*10)/10).toString()}
function dish(id){return LIB[id]||state.custom.find(c=>c.id===id)}
function allDishes(){return Object.values(LIB).concat(state.custom)}
function fmtServ(d,q){const m=/^(\d+(?:\.\d+)?)\s+([^+&]+)$/.exec(d.serv);if(m)return frac(+m[1]*q)+" "+m[2].trim();return q===1?d.serv:frac(q)+" × "+d.serv}
function sumItems(items){const t={};NK.forEach(k=>t[k]=0);(items||[]).forEach(it=>{const d=dish(it.id);if(!d)return;NK.forEach(k=>t[k]+=(d[k]||0)*it.q)});return t}

/* ---------- Targets ---------- */
function targets(p){
  const bmr=10*p.kg+6.25*p.hcm-5*p.age+(p.sex==="m"?5:-161);
  const tdee=bmr*[1.2,1.375,1.55,1.725][p.act||0];
  let adj=0;if(p.goal==="lose")adj=p.pace==="steady"?-500:-300;if(p.goal==="gain"||p.goal==="muscle")adj=p.pace==="steady"?400:250;
  const bmi=p.kg/Math.pow(p.hcm/100,2);let lowBmi=false;
  if(p.goal==="lose"&&bmi<18.5){adj=0;lowBmi=true}
  const floor=p.sex==="m"?1500:1200;
  const auto=Math.round(Math.max(floor,tdee+adj)/10)*10;let kcal=auto;const floorHit=tdee+adj<floor;
  const minK=Math.max(floor,Math.ceil((tdee-825)/10)*10);const manual=!!p.ovK;if(manual)kcal=clamp(Math.round(p.ovK),minK,5000);
  const st=p.macro||"balanced";
  let protein=Math.round(p.kg*((st==="protein"||p.goal==="muscle")?1.6:(st==="lowcarb"||st==="keto")?1.2:1.0));
  if(p.ovP&&st!=="custom")protein=Math.round(p.ovP);
  let carbs,fat;
  if(st==="lowcarb"||st==="keto"){carbs=st==="keto"?40:100;fat=Math.max(30,Math.round((kcal-protein*4-carbs*4)/9))}
  else{fat=Math.round(kcal*.3/9);carbs=Math.max(50,Math.round((kcal-protein*4-fat*9)/4))}
  let fib=RDA[p.std||"IN"][p.sex==="m"?"m":"f"].fib;if(st==="fibre")fib=p.sex==="m"?40:35;
  if(st==="custom"){if(+p.mP)protein=Math.round(+p.mP);if(+p.mC)carbs=Math.round(+p.mC);if(+p.mF)fat=Math.round(+p.mF);if(+p.mFib)fib=Math.round(+p.mFib)}
  const macroKcal=protein*4+carbs*4+fat*9;
  const weekly=Math.round(Math.abs(kcal-tdee)*7/7700*100)/100;
  return{kcal,auto,manual,protein,carbs,fat,fib,macroKcal,limit:{c:st==="lowcarb"||st==="keto"},style:st,tdee:Math.round(tdee),bmr:Math.round(bmr),adj,floor,floorHit,lowBmi,weekly}
}
function rda(p,k,T){if(k==="kcal")return T.kcal;if(k==="p")return T.protein;if(k==="c")return T.carbs;if(k==="f")return T.fat;if(k==="fib")return T.fib;return RDA[p.std||"IN"][p.sex==="m"?"m":"f"][k]}

/* ---------- Meal generation (rule-based, no AI) ---------- */
function dislikes(p){return String(p.dis||"").toLowerCase().split(/[,;\n]+/).map(s=>s.trim()).filter(s=>s.length>=3)}
function okDish(d,p){if(!DIETS[p.diet]||!DIETS[p.diet].includes(d.diet))return false;if(p.diet==="jain"&&!d.j)return false;
  const hay=(d.name+" "+d.ing.map(i=>i.n).join(" ")).toLowerCase();return !dislikes(p).some(w=>hay.includes(w))}
function pool(role,p){let a=allDishes().filter(d=>!d.noplan&&d.roles.includes(role)&&okDish(d,p));if(!a.length)a=allDishes().filter(d=>!d.noplan&&d.roles.includes(role)&&DIETS[p.diet].includes(d.diet));return a}
function weight(d,p,prep){const T=targets(p);let w=1;const cu=p.cu||[];const match=d.cu.includes("X")||[...d.cu].some(c=>cu.includes(c));
  if(cu.length)w*=match?2:0.45;let b=0;(p.focus||[]).forEach(k=>{const r=k==="p"?T.protein/3:rda(p,k,T);b+=Math.min((d[k]||0)/r,0.8)});w*=1+b*2.5;
  const st=T.style,kc=Math.max(d.kcal,1),cf=d.c*4/kc;
  if(st==="protein"||p.goal==="muscle")w*=1+clamp(d.p/kc*100-3,0,10)*.3;
  if(st==="keto")w*=Math.pow(clamp(1-cf,.02,1),3);
  if(st==="lowcarb")w*=Math.pow(clamp(1-cf,.05,1),1.5);
  if(st==="fibre")w*=1+clamp(d.fib/kc*100-1.5,0,5)*.35;
  if(prep)w*=(d.fr>=3||d.frz)?2:0.5;return w}
function wpick(list,wfn,avoid){let c=list.filter(d=>!avoid||!avoid.has(d.id));if(!c.length)c=list;if(!c.length)return null;let tot=0;const ws=c.map(d=>{const w=Math.max(0.0001,wfn(d));tot+=w;return w});let r=Math.random()*tot;for(let i=0;i<c.length;i++){if((r-=ws[i])<=0)return c[i]}return c[c.length-1]}
function pickN(list,n,wfn){const out=[],av=new Set();for(let i=0;i<n;i++){const d=wpick(list,wfn,av);if(!d)break;out.push(d);av.add(d.id)}return out}
function isBread(d){return /roti|bhakri|paratha/.test(d.serv)}
function pickBase(p,bread){const cu=p.cu||[];const riceLean=cu.includes("S")||cu.includes("B");let list=pool("R",p);
  if(bread===true)list=list.filter(isBread);else if(bread===false)list=list.filter(d=>!isBread(d));if(!list.length)list=pool("R",p);
  return wpick(list,d=>weight(d,p)*(isBread(d)?(riceLean?.7:1.4):(riceLean?1.6:.8))*(d.id==="roti"||d.id==="rice"?1.6:1))}
function addon(p,rem,ids){const c=ids.map(id=>LIB[id]).filter(d=>d&&okDish(d,p)&&d.kcal<=rem+25);return c.length?wpick(c,d=>weight(d,p)):null}
function buildMeal(slot,target,p,o){o=o||{};const items=[];const add=(d,q)=>{if(d)items.push({id:d.id,q})};
  const st0=p.macro||"balanced",prot=st0==="protein"||p.goal==="muscle",lc=st0==="keto"||st0==="lowcarb";
  if(slot==="B"){const d=o.main||wpick(carbOK(pool("B",p),p,"B"),x=>weight(x,p,o.prep),o.avoid);if(!d)return{items,eaten:false,locked:false};const q=clamp(roundTo(target/d.kcal,.5),1,2);add(d,q);const rem=target-d.kcal*q;if(rem>=50)add(addon(p,rem,lc?["egg","curd","paneertikka","nuts"]:prot?["egg","curd","milk","soymilk","paneertikka"]:["curd","milk","soymilk","egg","fruit","banana","chaas"]),1)}
  else if(slot==="S"){const d=o.main||wpick(carbOK(pool("K",p),p,"K"),x=>weight(x,p,o.prep),o.avoid);if(d)add(d,clamp(roundTo(target/d.kcal,.5),.5,2))}
  else if(o.onepot){const d=o.onepot;const q=clamp(roundTo(target*.88/d.kcal,.5),1,2);add(d,q);const rem=target-d.kcal*q;if(rem>=40)add(addon(p,rem,["salad","curd","chaas"]),1)}
  else{const st=p.macro||"balanced";const m=o.main||wpick(carbOK(pool("M",p),p,"M"),x=>weight(x,p,o.prep),o.avoid);const s=o.side||wpick(carbOK(pool("V",p),p,"V"),x=>weight(x,p,o.prep));
    const mq=(prot||st==="keto")&&m&&m.kcal*1.5<target*.75?1.5:1;let rem=target;if(m){add(m,mq);rem-=m.kcal*mq}

    else{const b=o.base||pickBase(p);if(b){let bq=isBread(b)?clamp(Math.round(rem/b.kcal),1,4):clamp(roundTo(rem/b.kcal,.5),.5,2);if(st==="lowcarb")bq=isBread(b)?1:.5;add(b,bq);rem-=b.kcal*bq}
      if(rem>=40)add(addon(p,rem,st==="lowcarb"||prot?["curd","egg","paneertikka","salad"]:["salad","curd","chaas"]),1)}}

function carbOK(list,p,role){const st=p.macro||"balanced";if(st!=="keto"&&st!=="lowcarb")return list;
  const lim=st==="keto"?(role==="V"?.45:.25):(role==="V"?1:.45);const f=list.filter(d=>d.c*4/Math.max(d.kcal,1)<=lim);return f.length?f:list}

function genDay(p){const T=targets(p);const B=buildMeal("B",T.kcal*SPLIT.B,p),L=buildMeal("L",T.kcal*SPLIT.L,p);
  const D=allowOnepot(p)&&Math.random()<.2?buildMeal("D",T.kcal*SPLIT.D,p,{onepot:wpick(pool("O",p),x=>weight(x,p))}):buildMeal("D",T.kcal*SPLIT.D,p,{avoid:new Set([mainId(L)])});

function dayTotals(day){const plan=zeroT(),eat=zeroT();if(!day)return{plan,eat};

function renderTabs(){document.getElementById("tabsInner").innerHTML=TABS.map(([k,l])=>`<button class="tab" data-act="tab" data-v="${k}" ${view.tab===k?'aria-current="page"':""}><span class="pip"></span>${ICON[k]}<span>${l}</span></button>`).join("")}

const TIFFIN='<svg class="tiffin" viewBox="0 0 64 64" aria-hidden="true"><path d="M22 10a10 6 0 0 1 20 0" fill="none" stroke="var(--muted)" stroke-width="3"/><rect x="16" y="12" width="32" height="7" rx="3.5" fill="var(--haldi)"/><rect x="13" y="21" width="38" height="11" rx="4" fill="var(--leaf)"/><rect x="13" y="34" width="38" height="11" rx="4" fill="var(--leaf)" opacity=".8"/><rect x="13" y="47" width="38" height="11" rx="4" fill="var(--leaf)" opacity=".6"/></svg>';

function renderWelcome(){
  return `<div class="hero">${TIFFIN}
  <h1>Indian meal prep that knows what your body needs.</h1>
  <p class="muted">Plan breakfast, lunch and dinner around your own calorie and macro targets, cook once for the week, find healthier versions of the food you crave, and keep an eye on protein, fibre, iron, B12 and more.</p></div>
  <div class="card stack" aria-label="Example lunch">
    <div class="row between"><span class="eyebrow">Example · Lunch</span><span class="badge">Iron-rich</span></div>
    <ul class="items"><li><span>Rajma</span><span>1 katori</span></li><li><span>Lehsuni palak</span><span>1 katori</span></li><li><span>Phulka roti</span><span>2 roti</span></li><li><span>Kachumber salad</span><span>1 bowl</span></li></ul>
    <div class="row between small muted num"><span>about 525 kcal · 22 g protein</span><span>7 mg iron</span></div>
  </div>
  <div class="stack" style="margin-top:18px">
    <button class="btn primary block" data-act="ob-start">Get started</button>
    <button class="btn block" data-act="demo">Explore with an example profile</button>
  </div>
  <p class="note">Free to use. Your plan stays on this device. DabbaCo counts anonymous usage, like how many weeks get planned, to improve the app. It never sends your name, weight or health details, and you can turn it off in Settings. Nutrition values are estimates and this is general food information, not medical advice.</p>`}

/* ----- Onboarding ----- */
const OB_STEPS=["name","body","size","act","goal","diet","macro","cu","dis","focus","prep","done"];
function startOb(editing){const d=editing?JSON.parse(JSON.stringify(state.profile)):{name:"",age:"",sex:"f",hcm:"",kg:"",act:1,goal:"maintain",pace:"gentle",tkg:"",diet:"veg",macro:"balanced",cu:[],dis:"",focus:[],sess:2,ppl:1,wu:"kg",hu:"cm",std:"IN"};
  if(d.hu==="ft"&&d.hcm){const tin=d.hcm/2.54;d.hft=Math.floor(tin/12);d.hin=Math.round(tin%12)}
  if(d.wu==="lb"&&d.kg){d.wIn=Math.round(d.kg*2.20462*10)/10}else d.wIn=d.kg;
  if(d.tkg){d.tIn=d.wu==="lb"?Math.round(d.tkg*2.20462*10)/10:d.tkg}
  d.macro=d.macro||"balanced";d.ovKIn=d.ovK||"";
  view.ob={step:0,d,editing:!!editing,err:""};render()}
function segBtns(f,opts,cur){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button data-act="ob-set" data-f="${f}" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join("")}</div>`}
function renderOb(){const o=view.ob,d=o.d,step=OB_STEPS[o.step];const pct=Math.round((o.step+1)/OB_STEPS.length*100);let body="";
  if(step==="name")body=`<h1>${o.editing?"Edit your profile":"What should we call you?"}</h1><label class="field">First name<input class="input" id="ob-name" data-f="name" value="${esc(d.name)}" autocomplete="given-name" maxlength="40"></label>`;
  if(step==="body")body=`<h1>A little about you</h1><p class="muted">Used only to estimate your daily calories.</p>
    <label class="field">Age<input class="input num" id="ob-age" data-f="age" type="number" inputmode="numeric" min="18" max="100" value="${esc(d.age)}"></label>
    <div class="field" style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem">Sex (for the calorie formula)${segBtns("sex",[["f","Female"],["m","Male"]],d.sex)}</div>`;
  if(step==="size"){const hu=d.hu==="ft";body=`<h1>Height and weight</h1>
    <div class="stack"><div class="row between"><b>Height</b>${segBtns("hu",[["cm","cm"],["ft","ft / in"]],d.hu)}</div>
    ${hu?`<div class="grid2"><label class="field">Feet<input class="input num" id="ob-hft" data-f="hft" type="number" inputmode="numeric" value="${esc(d.hft||"")}"></label><label class="field">Inches<input class="input num" id="ob-hin" data-f="hin" type="number" inputmode="numeric" value="${esc(d.hin||"")}"></label></div>`
      :`<label class="field">Height in cm<input class="input num" id="ob-hcm" data-f="hcm" type="number" inputmode="decimal" value="${esc(d.hcm)}"></label>`}
    <div class="row between"><b>Weight</b>${segBtns("wu",[["kg","kg"],["lb","lb"]],d.wu)}</div>
    <label class="field">Current weight in ${d.wu}<input class="input num" id="ob-w" data-f="wIn" type="number" inputmode="decimal" step="0.1" value="${esc(d.wIn||"")}"></label></div>`}
  if(step==="act")body=`<h1>How active are you?</h1><div class="stack">${ACT.map(([a,b],i)=>`<button class="opt" data-act="ob-set" data-f="act" data-v="${i}" aria-pressed="${+d.act===i}"><b>${a}</b><span>${b}</span></button>`).join("")}</div>`;
  if(step==="goal")body=`<h1>What's your goal?</h1><div class="stack">${GOALS.map(([v,a,b])=>`<button class="opt" data-act="ob-set" data-f="goal" data-v="${v}" aria-pressed="${d.goal===v}"><b>${a}</b><span>${b}</span></button>`).join("")}</div>
    ${d.goal!=="maintain"?`<div class="stack"><div class="row between wrapflex"><b>Pace</b>${segBtns("pace",[["gentle","Gentle"],["steady","Steady"]],d.pace)}</div>
    <label class="field">Target weight in ${d.wu} (optional)<input class="input num" id="ob-t" data-f="tIn" type="number" inputmode="decimal" step="0.1" value="${esc(d.tIn||"")}"></label></div>`:""}`;
  if(step==="diet")body=`<h1>How do you eat?</h1><div class="stack">${Object.entries(DIET_LABEL).map(([v,l])=>`<button class="opt" data-act="ob-set" data-f="diet" data-v="${v}" aria-pressed="${d.diet===v}"><b>${l}</b></button>`).join("")}</div>`;
  if(step==="macro")body=`<h1>How do you like to eat?</h1><p class="muted">This shapes your carbs, protein and fat targets. You can fine-tune grams later.</p><div class="stack">${MACROS.filter(m=>m[0]!=="custom").map(([v,a,b])=>`<button class="opt" data-act="ob-set" data-f="macro" data-v="${v}" aria-pressed="${d.macro===v}"><b>${a}</b><span>${b}</span></button>`).join("")}</div>${d.macro==="keto"||d.macro==="lowcarb"?`<p class="small" style="color:var(--warn)">If you have diabetes or kidney problems, are pregnant, or take regular medication, check with your doctor before going low carb.</p>`:""}`;
  if(step==="cu")body=`<h1>Food you love</h1><p class="muted">Pick any. Plans lean toward these but still mix things up.</p><div class="chips">${CUISINES.map(([v,l])=>`<button class="chip" data-act="ob-toggle" data-f="cu" data-v="${v}" aria-pressed="${d.cu.includes(v)}">${l}</button>`).join("")}</div>`;
  if(step==="dis")body=`<h1>Anything you won't eat?</h1><p class="muted">Separate with commas, for example: karela, mushroom, brinjal.</p><label class="field">Foods to skip<textarea class="input" id="ob-dis" data-f="dis">${esc(d.dis)}</textarea></label>`;
  if(step==="focus")body=`<h1>Nutrients to focus on</h1><p class="muted">Pick nutrients a blood test or your doctor said you need more of. You can skip this.</p><div class="chips">${FOCUS_KEYS.map(k=>`<button class="chip" data-act="ob-toggle" data-f="focus" data-v="${k}" aria-pressed="${d.focus.includes(k)}">${LABEL[k]}</button>`).join("")}</div>
    <p class="small muted">General food information, not medical advice. For deficiencies, talk to your doctor or a dietitian.</p>`;
  if(step==="prep")body=`<h1>Your meal prep</h1><div class="stack"><b>Prep sessions each week</b><div class="stack">
    <button class="opt" data-act="ob-set" data-f="sess" data-v="1" aria-pressed="${+d.sess===1}"><b>Once a week</b><span>One big cook, some boxes go in the freezer</span></button>
    <button class="opt" data-act="ob-set" data-f="sess" data-v="2" aria-pressed="${+d.sess===2}"><b>Twice a week</b><span>Fresher food, smaller cooks</span></button></div>
    <label class="field">How many people are you cooking for?<input class="input num" id="ob-ppl" data-f="ppl" type="number" inputmode="numeric" min="1" max="8" value="${esc(d.ppl)}"></label></div>`;
  if(step==="done"){const T=targets(Object.assign({},d,{ovK:null}));const lowNote=T.lowBmi?`<p class="banner">Your weight is already in a lower range, so your target is set to maintenance. Please check with a doctor before trying to lose weight.</p>`:"";
    const floorNote=T.floorHit?`<p class="small muted">We kept your target at ${T.floor.toLocaleString()} kcal, the safe minimum this app plans for.</p>`:"";
    body=`<h1>Your daily targets</h1>${lowNote}<div class="card stack"><div class="row between"><span class="muted">Calories</span><b class="num" style="font-family:var(--display);font-size:1.5rem">${T.kcal.toLocaleString()} kcal</b></div>
    <div class="row between"><span class="muted">Protein</span><b class="num">${T.protein} g</b></div>
    <div class="row between"><span class="muted">Breakfast · Lunch · Dinner · Snack</span><b class="num small">${Math.round(T.kcal*.25)} · ${Math.round(T.kcal*.35)} · ${Math.round(T.kcal*.3)} · ${Math.round(T.kcal*.1)}</b></div></div>
    <p class="muted small">Your body uses about ${T.tdee.toLocaleString()} kcal a day at your activity level (Mifflin-St Jeor estimate). ${T.adj<0?`Eating ${Math.abs(T.kcal-T.tdee)} kcal less means roughly ${T.weekly} kg a week of change.`:T.adj>0?`Eating ${T.kcal-T.tdee} kcal more supports gradual gain.`:"This target keeps your weight steady."} You can adjust these any time in Progress.</p>${floorNote}<label class="field">Want a different number? Set your own daily calories<input class="input num" id="ob-k" data-f="ovKIn" type="number" inputmode="numeric" value="${esc(d.ovKIn||"")}" placeholder="${T.auto}"></label><p class="small muted">Leave it empty to use ${T.auto.toLocaleString()} kcal.</p>`}
  const last=step==="done";
  return `<div class="ob"><div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div><div class="stack">${body}</div>
  ${o.err?`<p class="err" role="alert">${esc(o.err)}</p>`:""}
  <div class="ob-actions">${o.step>0?`<button class="btn" data-act="ob-back">Back</button>`:(o.editing?`<button class="btn" data-act="ob-cancel">Cancel</button>`:`<button class="btn" data-act="ob-cancel">Back</button>`)}
  <button class="btn primary" data-act="ob-next">${last?(o.editing?"Save profile":"Plan my week"):"Continue"}</button></div></div>`}
function obValidate(){const o=view.ob,d=o.d,step=OB_STEPS[o.step];
  if(step==="name"&&!String(d.name).trim())return "Enter a name so we know what to call you.";
  if(step==="body"){const a=+d.age;if(!a)return "Enter your age.";if(a<18)return "DabbaCo is built for adults 18 and over.";if(a>100)return "Enter an age between 18 and 100.";}
  if(step==="size"){let h=d.hu==="ft"?((+d.hft||0)*12+(+d.hin||0))*2.54:+d.hcm;if(!(h>=120&&h<=230))return "Enter a height between 120 and 230 cm (about 4 ft to 7 ft 6 in).";d.hcm=Math.round(h);
    let w=+d.wIn;if(d.wu==="lb")w=w/2.20462;if(!(w>=30&&w<=250))return "Enter a weight between 30 and 250 kg (66 to 550 lb).";d.kg=Math.round(w*10)/10}
  if(step==="goal"){if(d.goal==="maintain"){d.tkg=null}else if(d.tIn){let t=+d.tIn;if(d.wu==="lb")t=t/2.20462;if(!(t>=30&&t<=250))return "Enter a target weight between 30 and 250 kg, or leave it empty.";d.tkg=Math.round(t*10)/10}else d.tkg=null}
  if(step==="done"){if(String(d.ovKIn||"").trim()){const k=Math.round(+d.ovKIn);const T=targets(Object.assign({},d,{ovK:null}));const mn=Math.max(T.floor,Math.ceil((T.tdee-825)/10)*10);if(!(k>=mn&&k<=5000))return "Enter between "+mn.toLocaleString()+" and 5,000 kcal, or leave it empty.";d.ovK=k}else d.ovK=null}
  if(step==="prep"){const n=Math.round(+d.ppl);if(!(n>=1&&n<=8))return "Enter between 1 and 8 people.";d.ppl=n}
  return ""}
function finishOb(){const o=view.ob,d=o.d;const p={name:String(d.name).trim(),age:+d.age,sex:d.sex,hcm:d.hcm,kg:d.kg,act:+d.act,goal:d.goal,pace:d.pace,tkg:d.tkg||null,diet:d.diet,cu:d.cu,dis:d.dis,focus:d.focus,sess:+d.sess,ppl:+d.ppl,wu:d.wu,hu:d.hu,std:d.std||"IN",ovK:d.ovK||null,ovP:d.ovP||null,macro:d.macro||"balanced",track:d.track||null,mP:d.mP||null,mC:d.mC||null,mF:d.mF||null,mFib:d.mFib||null};
  const editing=o.editing;state.profile=p;track(editing?"profile_saved":"onboarding_completed",{diet:p.diet,goal:p.goal,style:p.macro,prep_sessions:p.sess,people:p.ppl,focus_count:(p.focus||[]).length,own_calories:!!p.ovK});
  if(!editing){state.demo=false;state.weights=[{d:today(),kg:p.kg}];state.days={};state.pantry={};DEFAULT_PANTRY.forEach(n=>state.pantry[n]=true);genWeek();view.tab="today";view.ob=null;save();render();toastMsg("Your week is planned. Here's today.")}
  else{const last=state.weights[state.weights.length-1];if(!last||Math.abs(last.kg-p.kg)>0.05){upsertWeight(today(),p.kg)}view.ob=null;view.tab="plan";view.flash="Profile saved. Tap Regenerate to plan the week with your new settings.";save();render()}}

/* ----- Today ----- */
function ringSvg(frac,col){const r=42,c=2*Math.PI*r,f=clamp(frac,0,1);return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}"/></svg>`}
function nutrientRows(p,T,plan,eat,keys){const foc=focusList(p);
  return keys.map(k=>{const r=rda(p,k,T);const pe=clamp(eat[k]/r*100,0,100),pp=clamp(plan[k]/r*100,0,100);const isF=foc.includes(k),lim=!!T.limit[k],over=lim&&eat[k]>r;
    return `<div class="nrow"><span class="small"><b>${LABEL[k]}</b>${isF?' <span class="badge warn">focus</span>':""}${lim?` <span class="badge${over?" low":""}">${over?"over limit":"limit"}</span>`:""}</span><span class="small muted num">${fmtN(eat[k],k)} / ${lim?"≤ ":""}${fmtN(r,k)} ${UNIT[k]} · planned ${Math.round(plan[k]/r*100)}%</span>
    <div class="bar${isF?" focus":""}${over?" limit":""}" role="img" aria-label="${LABEL[k]}: ${Math.round(pe)}% eaten, ${Math.round(pp)}% planned"><i class="plan" style="width:${pp}%"></i><i class="eat" style="width:${pe}%"></i></div></div>`}).join("")}
function mealCard(date,slot,label,m,p,T){const t=sumItems(m.items);const target=Math.round(T.kcal*SPLIT[slot]);const bad=richBadges(m.items,p,T);
  return `<article class="card meal${m.eaten?" done":""}"><div class="meal-head"><div><div class="slot">${label}</div><div class="small muted num">${Math.round(t.kcal)} kcal · ${fmtN(t.p,"p")} g protein · ${fmtN(t.c,"c")} g carbs · target ${target}</div></div>
  <div class="chips" style="justify-content:flex-end">${bad.map(k=>`<span class="badge">${SHORT[k]}-rich</span>`).join("")}</div></div>
  <ul class="items">${m.items.map(it=>{const d=dish(it.id);return d?`<li><span>${esc(d.name)}</span><span>${esc(fmtServ(d,it.q))}</span></li>`:""}).join("")||'<li><span class="muted">Nothing planned</span><span></span></li>'}</ul>
  <div class="meal-foot"><label class="check"><input type="checkbox" data-act="eaten" data-date="${date}" data-slot="${slot}" ${m.eaten?"checked":""}> Eaten</label>
  <div class="stepper" role="group" aria-label="Portion size"><button data-act="portion" data-date="${date}" data-slot="${slot}" data-v="0.8" aria-label="Smaller portion">−</button><button data-act="portion" data-date="${date}" data-slot="${slot}" data-v="1.25" aria-label="Bigger portion">+</button></div>
  <button class="btn sm ghost" data-act="swap" data-date="${date}" data-slot="${slot}">${ICON.swap.replace("<svg",'<svg width="16" height="16"')} Swap</button>
  <button class="btn sm ghost" data-act="healthier-meal" data-date="${date}" data-slot="${slot}">Make healthier</button></div></article>`}
function renderToday(){const p=state.profile,T=targets(p),k=today(),day=state.days[k];
  const head=`<div class="row between wrapflex" style="margin-bottom:14px"><div><p class="eyebrow">Today</p><h1>${dLong(k)}</h1></div></div>`;
  if(!day||!Object.keys(day.meals||{}).length&&!(day.extra||[]).length)return head+`<div class="card empty">${TIFFIN}<h2>No meals planned for today</h2><p class="muted">Build a day around your ${T.kcal.toLocaleString()} kcal target, or plan the whole week for meal prep.</p><div class="row wrapflex" style="justify-content:center"><button class="btn primary" data-act="gen-day">Generate my day</button><button class="btn" data-act="tab" data-v="plan">Plan my week</button></div></div>`+tomorrowCard(p,T)+footNote();
  const {plan,eat}=dayTotals(day);
  const summary=`<section class="card summary"><div class="ring">${ringSvg(eat.kcal/T.kcal,"var(--leaf)")}<div class="lbl"><b class="num">${Math.round(eat.kcal).toLocaleString()}</b><span class="small muted">of ${T.kcal.toLocaleString()}</span></div></div>
    <div class="stack" style="gap:8px;min-width:0"><div class="kv"><span class="muted">Eaten</span><b>${Math.round(eat.kcal).toLocaleString()} kcal</b></div><div class="kv"><span class="muted">Planned</span><b>${Math.round(plan.kcal).toLocaleString()} kcal</b></div>
    <div class="kv"><span class="muted">Protein</span><b>${Math.round(eat.p)} / ${T.protein} g</b></div><div class="bar" role="img" aria-label="Protein ${Math.round(eat.p/T.protein*100)}%"><i class="plan" style="width:${clamp(plan.p/T.protein*100,0,100)}%"></i><i class="eat" style="width:${clamp(eat.p/T.protein*100,0,100)}%"></i></div>
    <div class="small muted">${MACRO_LABEL[T.style]}${T.manual?" · your own target":""} · <button class="linkbtn" data-act="edit-targets">Change</button></div></div></section>`;
  const meals=SLOTS.map(([s,l])=>day.meals[s]?mealCard(k,s,l,day.meals[s],p,T):"").join("");
  const extras=`<section class="card stack"><div class="row between"><h3>Also ate</h3><button class="btn sm" data-act="add-food">+ Add food</button></div>
    ${(day.extra||[]).length?`<ul class="items">${day.extra.map((it,i)=>{const d=dish(it.id);return d?`<li><span>${esc(d.name)} · ${esc(fmtServ(d,it.q))}</span><span>${Math.round(d.kcal*it.q)} kcal <button class="linkbtn" data-act="rm-extra" data-i="${i}" aria-label="Remove ${esc(d.name)}">Remove</button></span></li>`:""}).join("")}</ul>`:`<p class="small muted">Had something that wasn't on the plan? Add it here so your totals stay honest.</p>`}</section>`;
  const keys=trackKeys(p);
  const nutr=`<section class="card stack"><div class="row between wrapflex"><h3>Nutrients today</h3><span class="row" style="gap:8px"><span class="small muted">solid = eaten, light = planned</span><button class="btn sm" data-act="edit-track">Edit</button></span></div>${nutrientRows(p,T,plan,eat,keys)}</section>`;
  const low=keys.filter(k2=>TIPS[k2]&&plan[k2]<0.7*rda(p,k2,T));const tipKeys=focusList(p).concat(low.filter(x=>!focusList(p).includes(x))).slice(0,3);
  const tips=tipKeys.length?`<section class="card stack"><h3>Boost tips</h3><ul class="tips">${tipKeys.map(k2=>{const arr=k2==="b12"&&p.diet==="vegan"?TIPS.b12vegan:TIPS[k2];return arr?`<li><span><b>${LABEL[k2]}.</b> ${esc(arr[(new Date().getDate())%arr.length])}</span></li>`:""}).join("")}</ul></section>`:"";
  return head+`<div class="stack">${summary}${meals}${extras}${nutr}${tips}${daySummary(k,p,T)}${tomorrowCard(p,T)}</div>`+footNote()}
function footNote(){return `<p class="note">General food information, not medical advice. For deficiencies, talk to your doctor or a dietitian. All nutrition values are estimates.</p>`}

/* ----- Plan ----- */
function renderPlan(){const p=state.profile,T=targets(p),w=state.week;
  const flash=view.flash?`<div class="banner"><span>${esc(view.flash)}</span><button class="linkbtn" data-act="dismiss-flash">Dismiss</button></div>`:"";
  const head=`<div style="margin-bottom:14px"><p class="eyebrow">Week plan</p><h1>${w?dShort(w.dates[0])+" – "+dShort(w.dates[6]):"Plan your week"}</h1></div>`;
  if(!w)return flash+head+`<div class="card empty">${TIFFIN}<h2>Plan seven days at once</h2><p class="muted">We'll reuse a few batch-cooked dishes across the week so you cook once or twice and eat well every day.</p><button class="btn primary" data-act="gen-week">Plan my week</button></div>`+footNote();
  const foc=focusList(p);
  const days=w.dates.map(k=>{const day=state.days[k];if(!day)return "";const {plan}=dayTotals(day);
    const chips=foc.map(f=>{const pc=Math.round(plan[f]/rda(p,f,T)*100);return `<span class="badge ${pc>=90?"":pc>=60?"warn":"low"}">${SHORT[f]} ${pc}%</span>`}).join("");
    return `<article class="card day"><div class="row between wrapflex"><h3>${dShort(k)}${k===today()?' <span class="badge">today</span>':""}</h3><span class="small muted num">${Math.round(plan.kcal).toLocaleString()} kcal · ${Math.round(plan.p)} g protein</span></div>
    ${chips?`<div class="chips">${chips}</div>`:""}
    ${SLOTS.map(([s,l])=>{const m=day.meals[s];if(!m)return "";const names=m.items.map(it=>{const d=dish(it.id);return d?esc(d.name):""}).filter(Boolean).join(", ");
      return `<div class="mrow"><span class="s">${l}</span><span class="d">${names||'<span class="muted">Nothing</span>'}${m.eaten?' <span class="badge">eaten</span>':""}</span><span class="acts"><button class="mini" data-act="lock" data-date="${k}" data-slot="${s}" aria-pressed="${!!m.locked}" aria-label="${m.locked?"Unlock":"Lock"} ${l}">${ICON.lock}</button><button class="mini" data-act="swap" data-date="${k}" data-slot="${s}" aria-label="Swap ${l}">${ICON.swap}</button></span></div>`}).join("")}</article>`}).join("");
  return flash+head+`<div class="row wrapflex" style="margin-bottom:14px"><button class="btn primary" data-act="gen-week">Regenerate week</button><span class="small muted">Locked and eaten meals stay put.</span></div><div class="stack">${days}</div>`+footNote()}

/* ----- Prep ----- */
function sessions(){const w=state.week;if(!w)return[];const d=w.dates;if(state.profile.sess===1)return[{prep:d[0],dates:d.slice()}];return[{prep:d[0],dates:d.slice(0,3)},{prep:d[3],dates:d.slice(3)}]}
function storeFor(d,off){if(off===0)return"fresh";if(d.fr>=off)return"fridge";if(d.frz)return"freezer";return"cook"}
const STORE_RANK={fresh:0,fridge:1,freezer:2,cook:3};
function boxStore(items,off){let worst="fresh",fr=99;items.forEach(it=>{const d=dish(it.id);if(!d)return;const s=storeFor(d,off);if(STORE_RANK[s]>STORE_RANK[worst])worst=s;fr=Math.min(fr,d.fr)});return{s:worst,fr}}
function fmtQty(n,u,name){if(u==="pc")return Math.ceil(n-1e-9)+" pc";if(LIQUID.has(name))return n>=1000?(Math.round(n/100)/10)+" L":Math.ceil(n/50)*50+" ml";return n>=1000?(Math.round(n/100)/10)+" kg":(n<50?Math.ceil(n/5)*5:Math.ceil(n/10)*10)+" g"}
function renderPrep(){const p=state.profile,T=targets(p),ppl=p.ppl||1;const head=`<div style="margin-bottom:14px"><p class="eyebrow">Meal prep</p><h1>Your prep boxes</h1></div>`;
  if(!state.week)return head+`<div class="card empty">${TIFFIN}<h2>Plan your week first</h2><p class="muted">Prep boxes and a step-by-step cooking guide come from your week plan.</p><button class="btn primary" data-act="gen-week">Plan my week</button></div>`;
  const ss=sessions();
  return head+(ppl>1?`<p class="small muted" style="margin-bottom:12px">Quantities are for ${ppl} people. Boxes show one person's portion.</p>`:"")+ss.map((s,si)=>{
    const boxes=[],agg={},fresh=[];
    s.dates.forEach(k=>{const day=state.days[k];if(!day)return;const off=Math.round((parseKey(k)-parseKey(s.prep))/864e5);
      SLOTS.forEach(([sl,lab])=>{const m=day.meals[sl];if(!m||!m.items.length)return;const st=boxStore(m.items,off);boxes.push({k,sl,lab,m,st,off});
        m.items.forEach(it=>{const d=dish(it.id);if(!d)return;const s2=storeFor(d,off);if(s2==="cook"){fresh.push(d.name+" ("+WD[parseKey(k).getDay()]+")");return}if(!agg[d.id])agg[d.id]={d,q:0,frz:false};agg[d.id].q+=it.q*ppl;if(s2==="freezer")agg[d.id].frz=true})})});
    const steps=prepSteps(Object.values(agg),boxes.length*ppl);
    const mins=25+Object.values(agg).reduce((a,x)=>a+(/[MO]/.test(x.d.roles)?14:/[VB]/.test(x.d.roles)?10:/R/.test(x.d.roles)?8:2),0);
    const dotCol={fresh:"var(--good)",fridge:"var(--good)",freezer:"var(--haldi)",cook:"var(--low)"};
    const stTxt=b=>b.st.s==="fresh"?"Eat on prep day":b.st.s==="fridge"?"Fridge · eat by "+WD[parseKey(b.k).getDay()]:b.st.s==="freezer"?"Freezer · thaw in the fridge the night before":"Cook part of this fresh on the day";
    return `<section class="section"><div class="row between wrapflex"><div><p class="eyebrow">${ss.length>1?"Session "+(si+1):"Weekly session"}</p><h2>Prep on ${dShort(s.prep)}</h2></div><span class="badge num">about ${Math.floor(mins/60)} h ${mins%60} min</span></div>
    <p class="small muted">Covers ${dShort(s.dates[0])} to ${dShort(s.dates[s.dates.length-1])} · ${boxes.length} boxes</p>
    <div class="card stack"><h3>Cooking guide</h3><ol class="steps">${steps.map(x=>`<li><div><b>${x.t}</b><span class="small muted">${x.b}</span></div></li>`).join("")}</ol>
    ${fresh.length?`<p class="small"><b>Cook fresh on the day:</b> <span class="muted">${esc([...new Set(fresh)].join(", "))}. These don't keep or freeze well.</span></p>`:""}</div>
    <div class="boxes">${boxes.map(b=>{const t=sumItems(b.m.items);const bad=richBadges(b.m.items,p,T);
      return `<div class="box"><div class="lid"><span>${WD[parseKey(b.k).getDay()]} · ${b.lab}</span><span class="kc">${Math.round(t.kcal)} kcal · ${Math.round(t.p)} g protein</span></div><div class="in">
      ${b.m.items.map(it=>{const d=dish(it.id);return d?`<span>${esc(d.name)} <span class="muted">· ${esc(fmtServ(d,it.q))}</span></span>`:""}).join("")}
      ${bad.length?`<div class="chips">${bad.map(k2=>`<span class="badge">${SHORT[k2]}-rich</span>`).join("")}</div>`:""}
      <span class="store"><span class="dot" style="background:${dotCol[b.st.s]}"></span>${stTxt(b)}</span></div></div>`}).join("")}</div></section>`}).join("")+
    `<div class="card flat stack" style="margin-top:18px"><h3>Storage and reheating</h3><ul class="tips"><li>Cool cooked food for 30 to 45 minutes, then close the lids and refrigerate within 2 hours of cooking.</li><li>Reheat until steaming hot all the way through. Add a splash of water to dals and gravies.</li><li>Freeze rotis with butter paper between them and warm them straight from frozen on a tawa.</li><li>Keep salads, cut fruit and curd separate and add them on the day.</li></ul></div>`+footNote()}
function prepSteps(list,nBoxes){const steps=[];const has=r=>list.filter(x=>x.d.roles.includes(r));const ingTot=(xs,cat)=>{const m={};xs.forEach(x=>x.d.ing.forEach(i=>{if(cat&&!cat.includes(i.n))return;const key=i.n+"|"+i.u;m[key]=(m[key]||0)+i.q*x.q}));return m};
  const dalCat=CAT[1][1],vegCat=CAT[0][1].filter(n=>!["lemon","coriander","fruit","banana","garlic","ginger","coconut"].includes(n));
  const soakers=list.filter(x=>x.d.soak);const batter=soakers.filter(x=>["idli","dosa","uttapam"].includes(x.d.id));const legumes=soakers.filter(x=>!batter.includes(x));
  const marinate=list.filter(x=>/chicken|mutton/.test(x.d.ing.map(i=>i.n).join(" "))&&x.d.ing.some(i=>i.n==="curd"));
  const night=[];
  if(legumes.length){const m=ingTot(legumes,dalCat);night.push("Soak "+Object.entries(m).map(([k,v])=>{const[n,u]=k.split("|");return n+" ("+fmtQty(v,u,n)+")"}).join(", ")+" in plenty of water.")}
  if(batter.length)night.push("Soak rice and urad dal for "+batter.map(x=>x.d.name.toLowerCase()).join(" and ")+" batter. Grind, then ferment 8 to 12 hours.");
  if(marinate.length)night.push("Marinate the meat for "+marinate.map(x=>x.d.name.toLowerCase()).join(" and ")+" in curd and spices, covered in the fridge.");
  if(night.length)steps.push({t:"The night before",b:night.join(" ")});
  const veg=ingTot(list,vegCat);const vs=Object.entries(veg).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(vs.length)steps.push({t:"Chop everything together",b:vs.map(([k,v])=>{const[n,u]=k.split("|");return n+" "+fmtQty(v,u,n)}).join(", ")+". Store chopped onion and tomato in separate boxes."});
  const pc=list.filter(x=>/[MO]/.test(x.d.roles)&&x.d.ing.some(i=>dalCat.includes(i.n)&&i.n!=="besan"&&i.n!=="roasted chana"));
  if(pc.length)steps.push({t:"Pressure cook dals and legumes",b:pc.map(x=>x.d.name+" ("+fmtServ(x.d,x.q)+")").join(", ")+". Cook them in separate containers in one cooker to save time."});
  const grains=list.filter(x=>x.d.roles.includes("R")&&!isBread(x.d)&&x.d.ing.length);
  if(grains.length)steps.push({t:"Cook grains",b:grains.map(x=>x.d.name+" "+fmtServ(x.d,x.q)+" (about "+fmtQty(x.d.ing[0].q*x.q,"g",x.d.ing[0].n)+" uncooked)").join(", ")+". Spread on a plate to cool quickly."});
  const rest=list.filter(x=>(/[MOV]/.test(x.d.roles))&&!pc.includes(x));
  if(rest.length)steps.push({t:"Cook gravies, sabzis and one-pot meals",b:rest.map(x=>x.d.name+" ("+fmtServ(x.d,x.q)+")").join(", ")+". Start these while the cooker is on."});
  const breads=list.filter(x=>x.d.roles.includes("R")&&isBread(x.d));
  if(breads.length)steps.push({t:"Rotis and bhakris",b:breads.map(x=>x.d.name+" ("+fmtServ(x.d,x.q)+")").join(", ")+". Knead the dough today (keeps 2 days in the fridge). Cook rotis for later days and freeze them."});
  const bf=list.filter(x=>x.d.roles.includes("B")&&!x.d.roles.includes("M"));
  if(bf.length)steps.push({t:"Breakfast prep",b:bf.map(x=>x.d.name+" ("+fmtServ(x.d,x.q)+")").join(", ")+". Make what keeps, and prepare batters or dry mixes for the rest."});
  steps.push({t:"Portion and label",b:"Fill "+nBoxes+" boxes, label each with the day and meal, and move boxes for later in the week to the freezer as shown below."});
  return steps}

function renderGroceries(){const head=`<div style="margin-bottom:14px"><p class="eyebrow">Groceries</p><h1>Shopping list</h1></div>`;

/* ----- Progress ----- */
function upsertWeight(d,kg){const i=state.weights.findIndex(x=>x.d===d);if(i>=0)state.weights[i].kg=kg;else state.weights.push({d,kg});state.weights.sort((a,b)=>a.d<b.d?-1:1);

function wDisp(kg){const p=state.profile;return p.wu==="lb"?(Math.round(kg*2.20462*10)/10):(Math.round(kg*10)/10)}
function weightChart(){const p=state.profile,ws=state.weights;if(ws.length<2)return `<p class="small muted">Log your weight a couple of times and a trend line appears here.</p>`;
  const W=340,H=170,L=34,R=10,Tp=12,B=24;const t0=parseKey(ws[0].d).getTime(),t1=parseKey(ws[ws.length-1].d).getTime(),span=Math.max(t1-t0,864e5);
  const vals=ws.map(x=>wDisp(x.kg));if(p.tkg)vals.push(wDisp(p.tkg));let lo=Math.min(...vals),hi=Math.max(...vals);const padv=Math.max(0.5,(hi-lo)*.15);lo=Math.floor(lo-padv);hi=Math.ceil(hi+padv);
  const X=d=>L+(parseKey(d).getTime()-t0)/span*(W-L-R),Y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
  const avg=ws.map((x,i)=>{const t=parseKey(x.d).getTime();const win=ws.filter(y=>{const ty=parseKey(y.d).getTime();return ty<=t&&ty>t-7*864e5});return{d:x.d,v:win.reduce((a,y)=>a+wDisp(y.kg),0)/win.length}});
  const ticks=[lo,(lo+hi)/2,hi];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${Math.round(v*10)/10}</text>`).join("")}
  ${p.tkg?`<line x1="${L}" x2="${W-R}" y1="${Y(wDisp(p.tkg))}" y2="${Y(wDisp(p.tkg))}" stroke="var(--haldi)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-R}" y="${Y(wDisp(p.tkg))-4}" text-anchor="end" style="fill:var(--warn)">goal</text>`:""}
  <path d="${avg.map((a,i)=>(i?"L":"M")+X(a.d).toFixed(1)+" "+Y(a.v).toFixed(1)).join(" ")}" fill="none" stroke="var(--leaf)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${ws.map((x,i)=>`<circle cx="${X(x.d).toFixed(1)}" cy="${Y(wDisp(x.kg)).toFixed(1)}" r="${i===ws.length-1?4.5:3}" fill="${i===ws.length-1?"var(--leaf)":"var(--surface)"}" stroke="var(--leaf)" stroke-width="1.5"/>`).join("")}
  <text x="${L}" y="${H-6}">${dShort(ws[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dShort(ws[ws.length-1].d)}</text></svg>
  <p class="small muted">Dots are your entries. The line is your 7-day average.</p>`}
function weekNutrients(){const p=state.profile,T=targets(p);const days=[];for(let i=0;i<7;i++)days.push(addDays(today(),-i));
  const eatDays=days.filter(k=>{const d=state.days[k];return d&&dayTotals(d).eat.kcal>0});let basis="eaten",list=eatDays;
  if(!list.length){basis="planned";list=(state.week?state.week.dates:[]).filter(k=>state.days[k])}

  const foc=focusList(p);const keys=trackKeys(p);

function renderProgress(){const p=state.profile,T=targets(p),ws=state.weights;const last=ws[ws.length-1],first=ws[0];

    ${ws.length>1?`<div class="row wrapflex small"><span class="badge">${ch>0?"+":""}${ch} ${p.wu} since ${dShort(first.d)}</span>${p.tkg?`<span class="badge warn">${Math.abs(Math.round((wDisp(last.kg)-wDisp(p.tkg))*10)/10)} ${p.wu} to goal</span>`:""}</div>`:""}
    ${weightChart()}
    <form class="row wrapflex" data-form="weight"><input class="input num grow" id="w-in" type="number" inputmode="decimal" step="0.1" placeholder="Weight in ${p.wu}" aria-label="Weight in ${p.wu}" style="flex:1 1 120px"><input class="input" id="w-date" type="date" value="${today()}" max="${today()}" aria-label="Date" style="flex:1 1 140px"><button class="btn primary" type="submit">Log</button></form>

    <p class="small muted">You burn about ${T.tdee.toLocaleString()} kcal a day. ${T.kcal<T.tdee-50?`Eating ${(T.tdee-T.kcal).toLocaleString()} kcal less than that is roughly ${T.weekly} kg of loss a week.`:T.kcal>T.tdee+50?`Eating ${(T.kcal-T.tdee).toLocaleString()} kcal more than that supports gradual gain.`:"Your target keeps your weight steady."} Split: breakfast 25%, lunch 35%, dinner 30%, snack 10%.</p>
    ${Math.abs(T.macroKcal-T.kcal)>T.kcal*.12?`<p class="small" style="color:var(--warn)">Your macros add up to about ${T.macroKcal.toLocaleString()} kcal, which doesn't match your ${T.kcal.toLocaleString()} kcal target. Adjust one or the other.</p>`:""}
    ${T.lowBmi?`<p class="small" style="color:var(--warn)">Your weight is in a lower range, so the calculated target is set to maintenance. Please check with a doctor before trying to lose weight.</p>`:""}</section>`;
  const nCard=`<section class="card stack"><h2>This week's nutrients</h2>${weekNutrients()}</section>`;
  return `<div style="margin-bottom:14px"><p class="eyebrow">Progress</p><h1>${esc(p.name)}'s trends</h1></div><div class="stack">${weightCard}${tCard}${nCard}</div>`+footNote()}

function swapSheet(date,slot){const p=state.profile,T=targets(p),day=state.days[date],cur=day.meals[slot];const target=T.kcal*SPLIT[slot];
  const cands=[];const seen=new Set([mainId(cur)]);
  for(let i=0;i<12&&cands.length<3;i++){let m;if((slot==="L"||slot==="D")&&i%4===3){const o=wpick(pool("O",p),x=>weight(x,p),seen);m=o?buildMeal(slot,target,p,{onepot:o}):null}else m=buildMeal(slot,target,p,{avoid:seen});
    if(!m||!m.items.length)continue;const id=mainId(m);if(seen.has(id))continue;seen.add(id);cands.push(m)}
  view.sheet={type:"swap",date,slot,cands};
  const label=SLOTS.find(s=>s[0]===slot)[1];
  openSheet(`<h2>Swap ${label.toLowerCase()} on ${dShort(date)}</h2><p class="small muted">Similar calories, around ${Math.round(target)} kcal.</p>
  ${cands.map((m,i)=>{const t=sumItems(m.items);const bad=richBadges(m.items,p,T);return `<button class="cand" data-act="pick-swap" data-i="${i}"><b>${m.items.map(it=>esc(dish(it.id).name)).join(" + ")}</b><span class="small muted num">${Math.round(t.kcal)} kcal · ${Math.round(t.p)} g protein</span>${bad.length?`<span class="chips">${bad.map(k=>`<span class="badge">${SHORT[k]}-rich</span>`).join("")}</span>`:""}</button>`}).join("")||'<p class="muted">No other dishes fit your settings. Try removing a food from your skip list.</p>'}
  <div class="row"><button class="btn grow" data-act="reswap">Show 3 more</button><button class="btn grow" data-act="close">Cancel</button></div>`)}
function foodSheet(){view.sheet={type:"food"};openSheet(`<h2>Add food you ate</h2><input class="input" id="food-q" placeholder="Search, like poha or chai" autocomplete="off"><div class="stack" id="food-res">${foodResults("")}</div><button class="btn" data-act="custom-form">Add a dish that isn't listed</button><button class="btn ghost" data-act="close">Done</button>`)}
function foodResults(q){q=q.trim().toLowerCase();const list=allDishes().filter(d=>!q||d.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,q?30:12);

/* ---------- Healthify engine (rule-based) ---------- */
/* per 100 g, or per piece for pc: kcal, protein, carbs, fat, fibre, iron mg, calcium mg */
const ING={butter:[717,.9,.1,81,0,0,24],ghee:[900,0,0,100,0,0,0],oil:[884,0,0,100,0,0,0],"mustard oil":[884,0,0,100,0,0,0],"olive oil":[884,0,0,100,0,0,0],
 cream:[250,2,3,25,0,0,70],"hung curd":[100,9,4,5,0,.1,110],curd:[60,3.5,4.5,3.5,0,.1,120],paneer:[265,18,1.2,21,0,.2,480],tofu:[120,13,2,7,1,2.7,350],
 "soya chunks":[345,52,33,.5,13,10,350],eggs:[72,6.3,.4,4.8,0,.9,25],potato:[77,2,17,.1,2.2,.8,10],cauliflower:[25,1.9,5,.3,2,.4,22],peas:[81,5.4,14,.4,5,1.5,25],
 "mixed veg":[40,2,8,.2,3,.8,35],spinach:[23,2.9,3.6,.4,2.2,2.7,99],cabbage:[25,1.3,6,.1,2.5,.5,40],maida:[364,10,76,1,2.7,1.2,15],atta:[340,12,72,1.7,11,3.9,34],
 pav:[110,3.5,21,1.5,1,1,30],"whole wheat pav":[100,4,18,1.5,3,1.2,30],rice:[360,7,79,.6,1.3,.8,10],millet:[350,12,60,4,8,2.8,30],"cauliflower rice":[25,1.9,5,.3,2,.4,22],
 bread:[265,9,49,3.2,2.7,3.6,150],"whole wheat bread":[250,12,43,3.5,6,2.5,160],sugar:[387,0,100,0,0,0,1],jaggery:[383,.4,98,.1,0,11,80],
 "mixed nuts":[600,20,20,52,7,3.5,100],chicken:[120,23,0,2.6,0,.4,10],noodles:[360,12,72,2,3,2,20],"whole wheat noodles":[340,13,65,2.5,8,3,30],cornflour:[381,.3,91,.1,1,.5,2]};
const HK=["kcal","p","c","f","fib","fe","ca"];
const GOALTXT={light:"fewer calories and less fat",protein:"more protein",lowcarb:"fewer carbs",fibre:"more fibre",gain:"more calories and protein from wholesome food, for healthy weight gain"};
function nutOf(n,q,u){const v=ING[n];if(!v)return null;const m=u==="pc"?q:q/100;return{kcal:v[0]*m,p:v[1]*m,c:v[2]*m,f:v[3]*m,fib:v[4]*m,fe:v[5]*m,ca:v[6]*m}}
function proteinAdd(d,p){if(d.roles==="R")return null;const meat=d.ing.some(i=>/chicken|mutton|fish|prawn|salmon/.test(i.n));
  if(meat)return{t:"Add more meat, less gravy",b:"Use 50 g more chicken per serving and keep the gravy thick.",ops:[{add:"chicken",q:50}]};
  if(p.diet==="vegan")return{t:"Add tofu",b:"Fold in 60 g crumbled firm tofu, or 20 g soaked soya granules, in the last 5 minutes.",ops:[{add:"tofu",q:60}]};
  if(d.ing.some(i=>i.n==="paneer"))return{t:"Serve with hung-curd raita",b:"A small katori of hung curd with cucumber and roasted jeera adds about 7 g protein.",ops:[{add:"hung curd",q:75}]};
  return{t:"Add paneer",b:"Fold in 50 g crumbled or cubed paneer just before serving so it stays soft.",ops:[{add:"paneer",q:50}]}}
function healthRules(d,goal,p){const has=n=>d.ing.find(i=>i.n===n);const R=[];const sweet=d.ing.some(i=>i.n==="sugar"||i.n==="jaggery");const notGain=goal!=="gain";
  if(has("butter")&&notGain)R.push({t:"Use a third of the butter",b:"Cook in a non-stick pan and add one teaspoon at the end for flavour.",ops:[{rm:"butter",frac:.66}]});
  if(has("ghee")&&notGain&&goal!=="lowcarb")R.push({t:"Halve the ghee",b:"Measure it with a teaspoon instead of pouring from the jar.",ops:[{rm:"ghee",frac:.5}]});
  ["oil","mustard oil","olive oil"].forEach(o=>{const i=has(o);if(i&&i.q>=5&&(goal==="light"||goal==="protein"||goal==="fibre"))R.push({t:"Use less "+o,b:"Use a non-stick pan and measure with a teaspoon. Two teaspoons are enough for most sabzis.",ops:[{rm:o,frac:.4}]})});
  if(has("cream")&&notGain)R.push({t:"Swap cream for hung curd",b:"Whisk hung curd smooth, take the pan off the heat for a minute, then stir it in so it doesn't split.",ops:[{rep:"cream",to:"hung curd",ratio:1.2}]});
  if(has("maida")&&notGain)R.push({t:"Use whole wheat atta instead of maida",b:"Atta adds fibre. Mix in a spoon of besan if the coating needs to be crisper.",ops:[{rep:"maida",to:"atta",ratio:1}]});
  const pot=has("potato");if(pot){if(goal==="lowcarb")R.push({t:"Replace potato with cauliflower",b:"Boil cauliflower until very soft and mash or cube it the way you would potato.",ops:[{rep:"potato",to:"cauliflower",ratio:1}]});
    else if(goal==="light"||goal==="fibre")R.push({t:"Swap half the potato for cauliflower and peas",b:"You keep the texture with fewer calories and more fibre.",ops:[{rep:"potato",to:"cauliflower",ratio:.7,frac:.5},{add:"peas",q:Math.round(pot.q*.25)}]})}
  if(has("pav")){if(goal==="lowcarb")R.push({t:"Skip the pav",b:"Eat it from a bowl topped with onion and lemon, with grilled paneer or cucumber sticks on the side.",ops:[{rm:"pav",frac:1}]});
    else if(notGain)R.push({t:"Use whole wheat pav",b:"Most bakeries and supermarkets stock it. Toast it dry or with a light brush of butter.",ops:[{rep:"pav",to:"whole wheat pav",ratio:1}]})}
  if(has("bread")){if(goal==="lowcarb")R.push({t:"Have one slice instead of two",b:"Add an extra egg or some paneer to stay full.",ops:[{rm:"bread",frac:.5}]});
    else if(notGain)R.push({t:"Use whole wheat or multigrain bread",b:"More fibre keeps you full for longer.",ops:[{rep:"bread",to:"whole wheat bread",ratio:1}]})}
  if(has("rice")){if(goal==="lowcarb")R.push({t:"Use cauliflower rice",b:"Grate a cauliflower and sauté it with a pinch of salt for 4 to 5 minutes until just tender.",ops:[{rep:"rice",to:"cauliflower rice",ratio:3}]});
    else if(goal==="fibre")R.push({t:"Use foxtail millet instead of rice",b:"Soak the millet for 30 minutes and cook it like rice with 2½ cups of water per cup.",ops:[{rep:"rice",to:"millet",ratio:1}]});
    else if(goal==="light")R.push({t:"Half the rice, double the vegetables",b:"Bulk it up with extra beans, carrots, peas and cauliflower.",ops:[{rm:"rice",frac:.5},{add:"mixed veg",q:60}]})}
  if(has("noodles")&&notGain){if(goal==="lowcarb")R.push({t:"Half the noodles, more vegetables",b:"Shredded cabbage and carrot make up the volume.",ops:[{rm:"noodles",frac:.5},{add:"cabbage",q:60}]});
    else R.push({t:"Use whole wheat noodles",b:"They hold up well in a stir-fry.",ops:[{rep:"noodles",to:"whole wheat noodles",ratio:1}]})}
  if(has("cornflour")&&notGain)R.push({t:"Use half the cornflour",b:"A light dusting is enough. Air-fry or pan-sear instead of deep-frying.",ops:[{rm:"cornflour",frac:.5}]});
  if(sweet&&notGain)R.push({t:"Cut the sweetener by a third",b:"Add cardamom or a pinch of cinnamon so you don't miss it.",ops:[{rm:has("sugar")?"sugar":"jaggery",frac:.35}]});
  if(goal==="protein"||goal==="gain"||goal==="lowcarb"){const pr=proteinAdd(d,p);if(pr)R.push(pr)}
  if((goal==="fibre"||goal==="light")&&!/^[RA]/.test(d.roles)&&!sweet)R.push({t:"Add a handful of greens",b:"Stir in chopped spinach or methi in the last 3 minutes of cooking.",ops:[{add:"spinach",q:50}]});
  if(goal==="gain")R.push({t:"Add healthy calories",b:"Top with a tablespoon of chopped nuts and have a glass of milk or a katori of curd alongside.",ops:[{add:"mixed nuts",q:15}]});
  return R}
function applyRules(d,rules,on){const ing=d.ing.map(i=>Object.assign({},i));const t={};HK.forEach(k=>t[k]=d[k]||0);
  const sub=(n,q,u)=>{const x=nutOf(n,q,u);if(x)HK.forEach(k=>t[k]-=x[k])},addN=(n,q,u)=>{const x=nutOf(n,q,u);if(x)HK.forEach(k=>t[k]+=x[k])};
  rules.forEach((r,ri)=>{if(!on[ri])return;r.ops.forEach(op=>{
    if(op.rm){const i=ing.find(x=>x.n===op.rm);if(!i)return;const q=i.q*op.frac;sub(i.n,q,i.u);i.q-=q}
    else if(op.rep){const i=ing.find(x=>x.n===op.rep);if(!i)return;const q=i.q*(op.frac||1);sub(i.n,q,i.u);i.q-=q;const nq=q*(op.ratio||1);addN(op.to,nq,i.u);const j=ing.find(x=>x.n===op.to);if(j)j.q+=nq;else ing.push({n:op.to,q:nq,u:i.u})}
    else if(op.add){const u=op.u||"g";addN(op.add,op.q,u);const j=ing.find(x=>x.n===op.add);if(j)j.q+=op.q;else ing.push({n:op.add,q:op.q,u})}})});
  HK.forEach(k=>t[k]=Math.max(0,t[k]));return{t,ing:ing.filter(i=>i.q>0.01)}}
function makeVariant(id,g,on){const d=dish(id);const rules=healthRules(d,g,state.profile);const {t,ing}=applyRules(d,rules,on);
  const vid="h_"+d.id+"_"+g+"_"+on.map(x=>x?1:0).join("");let v=dish(vid);if(v)return v;
  v=Object.assign({},d,{id:vid,name:HPREFIX[g]+" "+d.name.charAt(0).toLowerCase()+d.name.slice(1),ing,variant:true,base:d.id,custom:true,noplan:true});
  HK.forEach(k=>v[k]=Math.round(t[k]*10)/10);state.custom.push(v);return v}

/* ---------- Today: summary and tomorrow ---------- */
function statusOf(k,eat,r,T){const pc=r?eat/r:0;if(T.limit[k])return pc>1?["over limit","low"]:["within limit",""];
  if(k==="kcal"){if(pc>1.1)return["over target","warn"];if(pc>=.9)return["on target",""];return["under target","warn"]}
  if(pc>=.9)return["on target",""];if(pc>=.7)return["a little short","warn"];return["low","low"]}
function eatenItems(day){const out=[];SLOTS.forEach(([s,l])=>{const m=day.meals&&day.meals[s];if(m&&m.eaten)m.items.forEach(it=>out.push({l,it}))});(day.extra||[]).forEach(it=>out.push({l:"Extra",it}));return out}
function daySummary(k,p,T){const day=state.days[k];if(!day)return"";const {eat}=dayTotals(day);const list=eatenItems(day);const keys=["kcal"].concat(trackKeys(p));
  const title=new Date().getHours()>=18?"Your day":"Today so far";
  if(!list.length)return `<section class="card stack"><h3>${title}</h3><p class="small muted">Tick meals as eaten and your summary builds here: what you ate, and how much protein, fibre, carbs and fat you had against your targets.</p></section>`;
  return `<section class="card stack"><div class="row between wrapflex"><h3>${title}</h3><button class="btn sm" data-act="share-day">Share my day</button></div>
  <ul class="items">${list.map(x=>{const d=dish(x.it.id);return d?`<li><span>${esc(d.name)} <span class="muted small">· ${x.l}</span></span><span>${Math.round(d.kcal*x.it.q)} kcal</span></li>`:""}).join("")}</ul>
  <div style="overflow-x:auto"><table class="cmp"><thead><tr><th>Nutrient</th><th>Had</th><th>Target</th><th>Status</th></tr></thead><tbody>${keys.map(k2=>{const r=rda(p,k2,T);const [s,c]=statusOf(k2,eat[k2],r,T);
    return `<tr><td>${LABEL[k2]}</td><td>${fmtN(eat[k2],k2)} ${UNIT[k2]}</td><td>${T.limit[k2]?"≤ ":""}${fmtN(r,k2)}</td><td class="${c==="low"?"dn":c==="warn"?"wn":"up"}">${s}</td></tr>`}).join("")}</tbody></table></div></section>`}
function tomorrowCard(p,T){const k=addDays(today(),1),day=state.days[k];
  if(!day||!Object.keys(day.meals||{}).length)return `<section class="card stack"><h3>Tomorrow · ${dShort(k)}</h3><p class="small muted">Nothing planned yet.</p><div><button class="btn sm primary" data-act="gen-tomorrow">Plan tomorrow</button></div></section>`;
  const {plan}=dayTotals(day);
  return `<section class="card stack"><div class="row between wrapflex"><h3>Tomorrow · ${dShort(k)}</h3><span class="small muted num">${Math.round(plan.kcal).toLocaleString()} kcal · ${Math.round(plan.p)} g protein · ${Math.round(plan.fib)} g fibre</span></div>
  ${SLOTS.map(([s,l])=>{const m=day.meals[s];if(!m)return"";return `<div class="mrow"><span class="s">${l}</span><span class="d">${m.items.map(it=>{const d=dish(it.id);return d?esc(d.name):""}).filter(Boolean).join(", ")}</span><span class="small muted num">${Math.round(sumItems(m.items).kcal)}</span></div>`}).join("")}</section>`}
function dayText(k){const p=state.profile,T=targets(p),day=state.days[k];if(!day)return"";const {eat}=dayTotals(day);
  let t="My day on DabbaCo, "+dShort(k)+"\n\nWhat I ate:\n"+eatenItems(day).map(x=>{const d=dish(x.it.id);return d?"- "+d.name+" ("+Math.round(d.kcal*x.it.q)+" kcal)":""}).filter(Boolean).join("\n")+"\n\n";
  t+=["kcal"].concat(trackKeys(p)).map(k2=>LABEL[k2]+": "+fmtN(eat[k2],k2)+" / "+fmtN(rda(p,k2,T),k2)+" "+UNIT[k2]).join("\n");
  const tm=state.days[addDays(k,1)];if(tm&&tm.meals)t+="\n\nTomorrow:\n"+SLOTS.map(([s,l])=>{const m=tm.meals[s];return m?l+": "+m.items.map(it=>{const d=dish(it.id);return d?d.name:""}).filter(Boolean).join(", "):""}).filter(Boolean).join("\n");
  return t}

/* ---------- Recipes tab ---------- */
let AI;
function allRecipes(){return RECIPES.concat(state.ai||[])}
function findRecipe(id){return allRecipes().find(r=>r.id===id)}
function recipeOK(r,p){return DIETS[p.diet].includes(r.diet)}
function cap(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1)}
function fmtIng(q,u){if(u==="g"||u==="ml"){const v=q>=100?Math.round(q/10)*10:Math.max(1,Math.round(q/5)*5||Math.round(q));return v+" "+u}if(u==="pc")return frac(Math.max(.5,Math.round(q*2)/2));return frac(Math.max(.25,Math.round(q*4)/4))+" "+u}
function recipeCard(r){const g=view.hgoal||defaultHGoal(state.profile);return `<button class="rcard" data-act="open-recipe" data-id="${esc(r.id)}"><span class="was">Instead of ${esc(r.was)}</span><b>${esc(r.name)}</b><span class="small muted num">${r.after.kcal} kcal · ${r.after.p} g protein · ${r.prep+r.cook} min</span><span class="chips">${r.tags.map(t=>`<span class="badge${t===g?" warn":""}">${HPREFIX[t]||esc(t)}</span>`).join("")}${r.ai?'<span class="badge">By Claude</span>':""}</span></button>`}
function aiBox(q){if(!AI)return"";
  return `<section class="card stack"><h3>Ask Claude for any dish</h3><p class="small muted">A healthier ${esc(q)} written for your goal and diet, with a detailed step-by-step recipe.</p><div><button class="btn primary" data-act="ai-recipe">Create a healthier ${esc(q)}</button></div><p class="small muted" id="ai-status" aria-live="polite"></p></section>`}
function recipeResults(q){const p=state.profile,g=view.hgoal||defaultHGoal(p);q=q.trim().toLowerCase();

  let html=rs.length?`<div class="rgrid">${rs.map(recipeCard).join("")}</div>`:"";

function renderRecipes(){const p=state.profile;if(view.recipe)return renderRecipeDetail();const g=view.hgoal||defaultHGoal(p);

/* ----- Cook mode ----- */
let cook=null;
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+pad(s%60)}
function openCook(){const r=findRecipe(view.recipe);if(!r)return;cook={r,i:0,left:null,run:false,tm:null,lock:null};renderCook();
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>{if(cook)cook.lock=l}).catch(()=>{})}catch(e){}}
function stopTimer(){if(cook){cook.run=false;clearInterval(cook.tm)}}
function closeCook(){stopTimer();try{cook&&cook.lock&&cook.lock.release()}catch(e){}cook=null;renderCook()}
function renderCook(){const c=document.getElementById("cook");if(!cook){c.hidden=true;c.innerHTML="";return}const r=cook.r,st=r.steps[cook.i],n=r.steps.length;
  if(cook.left===null)cook.left=(st[2]||0)*60;c.hidden=false;
  c.innerHTML=`<div class="wrapc"><div class="row between"><span class="eyebrow">Step ${cook.i+1} of ${n}</span><button class="btn sm" data-act="cook-close">Close</button></div>
  <div class="progress"><i style="width:${(cook.i+1)/n*100}%"></i></div><p class="small muted">${esc(r.name)}</p>
  <h2 style="font-size:1.6rem">${esc(st[0])}</h2><div class="stepbody">${esc(st[1])}</div>
  ${st[2]?`<div class="row between wrapflex"><span class="timer" id="cook-timer">${mmss(cook.left)}</span><div class="row"><button class="btn" data-act="cook-timer">${cook.run?"Pause":"Start timer"}</button><button class="btn ghost" data-act="cook-reset">Reset</button></div></div>`:""}
  <div class="row"><button class="btn grow" data-act="cook-prev" ${cook.i===0?"disabled":""}>Back</button><button class="btn primary grow" data-act="cook-next">${cook.i===n-1?"Finish":"Next step"}</button></div></div>`}
function cookTick(){if(!cook||!cook.run)return;cook.left-=1;const t=document.getElementById("cook-timer");if(t)t.textContent=mmss(cook.left);
  if(cook.left<=0){stopTimer();toastMsg("Time's up: "+cook.r.steps[cook.i][0]);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}renderCook()}}

async function initAI(){try{AI=(window.claude&&window.claude.use)?(await window.claude.use("sample"))||null:null}catch(e){AI=null}
